name: PR Validation

# PR 검증의 유일한 진입점이다. repository quality 가 변경 파일을 완전하게 분류한 뒤
# static analysis · unit test · screenshot 을 reusable workflow 로 한 번씩 부른다.
# 각 job check 를 ruleset 에서 직접 required 로 요구하므로 문서 전용 PR 도 같은 이름의
# check 를 만들되, 무거운 job 내부는 즉시 건너뛴다. 모든 검증 뒤 집계용 runner 는 없다.
# required context 이름은 pr-gate-policy.test.mjs 에 고정해 workflow 이름 변경과 ruleset
# 변경이 함께 검토되도록 한다.
#
# base 필터를 두지 않는다 — base 변경(feat/* → develop)은 pull_request 기본 activity
# type 에 없어 재트리거되지 않으므로, 필터가 있으면 스택 PR 이 검증을 한 번도 거치지
# 않고 머지된다.
on:
  # 본문 CI Test Plan을 바꾸면 이전 green check를 재사용하지 않고 다시 검증한다.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # merge queue 는 큐 ref 에서 required check 를 다시 요구한다. merge group 에는 PR 이
  # 없어 pull_request_number 가 0 으로 떨어지고, develop push 가 이미 쓰는 전량 검증
  # 경로를 그대로 탄다. PR 본문을 재료로 쓰는 CI Test Plan · linked Issue 게이트는
  # repository-quality 안에서 pull_request_number > 0 조건으로 스스로 비활성된다.
  merge_group:
    types: [checks_requested]
  # GITHUB_TOKEN 으로 PR 브랜치에 baseline/stack merge commit 을 올리면 pull_request
  # 이벤트가 다시 발생하지 않는다. 권한 있는 bridge 가 같은 SHA 에 필수 검증을 붙일 때 쓴다.
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "현재 ref 와 일치해야 하는 열린 PR 번호"
        required: true
        type: number

# 같은 PR 의 옛 실행을 끊는다. head 가 갱신되면 이전 SHA 의 결과는 판단 근거가 아니다.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  repository-quality:
    name: Repository Quality
    uses: ./.github/workflows/repository-quality.yml
    with:
      # workflow_dispatch API payloads can arrive as strings even when the declared input type is
      # number. Reusable workflow inputs are type-checked before any job is created, so normalize
      # every event path back to a JSON number here.
      pull_request_number: ${{ fromJSON(format('{0}', inputs.pull_request_number || github.event.pull_request.number || 0)) }}

  static-analysis:
    name: Static Analysis
    needs: repository-quality
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/lint.yml
    with:
      pull_request_number: ${{ fromJSON(format('{0}', inputs.pull_request_number || github.event.pull_request.number || 0)) }}
      run_ktlint: ${{ needs.repository-quality.result != 'success' || needs.repository-quality.outputs.ktlint_required != 'false' }}
      ktlint_tasks: ${{ needs.repository-quality.result == 'success' && needs.repository-quality.outputs.ktlint_tasks || 'ktlintCheck :build-logic:ktlintCheck' }}
      run_android_lint: ${{ needs.repository-quality.result != 'success' || needs.repository-quality.outputs.android_lint_required != 'false' }}
      android_lint_tasks: ${{ needs.repository-quality.result == 'success' && needs.repository-quality.outputs.android_lint_tasks || 'lintDebug :app:processDebugMainManifest' }}
      verify_manifest: ${{ needs.repository-quality.result != 'success' || needs.repository-quality.outputs.verify_manifest != 'false' }}

  unit-test:
    name: Unit Test
    needs: repository-quality
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/unit-test.yml
    with:
      pull_request_number: ${{ fromJSON(format('{0}', inputs.pull_request_number || github.event.pull_request.number || 0)) }}
      run_validation: ${{ needs.repository-quality.result != 'success' || needs.repository-quality.outputs.unit_test_required != 'false' }}
      run_node_tests: ${{ needs.repository-quality.result != 'success' || needs.repository-quality.outputs.run_node_tests != 'false' }}
      gradle_tasks: ${{ needs.repository-quality.result == 'success' && needs.repository-quality.outputs.unit_test_tasks || ':koverXmlReportCi :koverHtmlReportCi :konsist:test :build-logic:test :app:compileDebugAndroidTestKotlin' }}
      coverage_modules: ${{ needs.repository-quality.result == 'success' && needs.repository-quality.outputs.coverage_modules || 'all' }}

  screenshot:
    name: Screenshot
    needs: repository-quality
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/screenshot.yml
    with:
      pull_request_number: ${{ fromJSON(format('{0}', inputs.pull_request_number || github.event.pull_request.number || 0)) }}
      run_validation: ${{ needs.repository-quality.result != 'success' || needs.repository-quality.outputs.screenshot_required != 'false' }}
      gradle_tasks: ${{ needs.repository-quality.result == 'success' && needs.repository-quality.outputs.screenshot_tasks || ':core:ui:validateScreenshotTest :feature:onboarding:presentation:validateScreenshotTest :feature:feed:presentation:validateScreenshotTest :feature:editor:presentation:validateScreenshotTest :feature:foryou:presentation:validateScreenshotTest :feature:notification:presentation:validateScreenshotTest' }}
      screenshot_modules: ${{ needs.repository-quality.result == 'success' && needs.repository-quality.outputs.screenshot_modules || ':core:ui :feature:onboarding:presentation :feature:feed:presentation :feature:editor:presentation :feature:foryou:presentation :feature:notification:presentation' }}
