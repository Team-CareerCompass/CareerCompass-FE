name: Android Dependency Audit

# Claude Code 루틴보다 먼저 기계적 증거를 만든다.
# GitHub schedule은 UTC이며 정각 부하를 피하도록 월요일 06:17 KST에 실행한다.
on:
  schedule:
    - cron: '17 21 * * 0'
  workflow_dispatch:
    inputs:
      publish_issues:
        description: "감사 결과로 GitHub 이슈를 생성·갱신"
        required: true
        default: false
        type: boolean

concurrency:
  group: android-dependency-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Collect and verify dependency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPORT_DIR: build/reports/dependency-audit
    steps:
      - name: Clone default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up release build configuration
        uses: ./.github/actions/setup-release-config
        with:
          require: KAKAO_NATIVE_APP_KEY GOOGLE_WEB_CLIENT_ID GOOGLE_SERVICES_JSON_B64
          kakao-native-app-key: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          google-web-client-id: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          google-services-json-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Run dependency audit script tests
        run: node --test .github/scripts/*.test.mjs

      - name: Collect resolved Gradle dependency graphs
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          mkdir -p "$REPORT_DIR/resolved"
          : > "$REPORT_DIR/resolution-status.txt"

          run_report() {
            name="$1"
            shift
            set +e
            ./gradlew "$@" --console=plain > "$REPORT_DIR/resolved/$name.txt" 2>&1
            status=$?
            set -e
            printf '%s=%s\n' "$name" "$status" >> "$REPORT_DIR/resolution-status.txt"
          }

          run_report root-build-environment buildEnvironment
          run_report app-debug-runtime :app:dependencies --configuration debugRuntimeClasspath
          run_report konsist-test-runtime :konsist:dependencies --configuration testRuntimeClasspath
          run_report core-model-runtime :core:model:dependencies --configuration runtimeClasspath
          run_report core-domain-runtime :core:domain:dependencies --configuration runtimeClasspath
          run_report onboarding-domain-runtime :feature:onboarding:domain:dependencies --configuration runtimeClasspath
          run_report feed-domain-runtime :feature:feed:domain:dependencies --configuration runtimeClasspath
          run_report editor-domain-runtime :feature:editor:domain:dependencies --configuration runtimeClasspath
          run_report profile-domain-runtime :feature:profile:domain:dependencies --configuration runtimeClasspath
          run_report foryou-domain-runtime :feature:foryou:domain:dependencies --configuration runtimeClasspath
          run_report notification-domain-runtime :feature:notification:domain:dependencies --configuration runtimeClasspath

      # init script 는 develop 에 의도적으로 남긴 red 게이트(.github/ci-expected-failures.json)를
      # 제외한다. 없으면 `testDebugUnitTest` 가 그 테스트를 그대로 돌려 이 감사만 상시 red 가
      # 되고, 매주 「호환성 검증 실패」 이슈가 새로 열린다 — 실제 SDK·JDK 경계 회귀가 같은
      # 빨간 X 에 묻힌다 (#1653). 제외는 목록에 오른 테스트에 한정되므로 목록 밖 실패는 그대로
      # 이 게이트를 깬다. XPASS 감시(probe-unit)는 여기 붙이지 않는다 — 게이트 해제를 강제하는
      # probe 는 unit-test.yml 이 모든 develop push 와 full 범위 PR 에서 이미 돌리고 있어,
      # 주 1회 실행에 같은 신호를 하나 더 두면 해제를 앞당기지 못한 채 red 만 늘어난다.
      - name: Run current SDK and JVM compatibility gate
        id: compatibility
        continue-on-error: true
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set +e
          ./gradlew assembleDebug testDebugUnitTest \
            :core:model:test :core:domain:test \
            :feature:onboarding:domain:test \
            :feature:feed:domain:test \
            :feature:editor:domain:test \
            :feature:profile:domain:test \
            :feature:foryou:domain:test \
            :feature:notification:domain:test \
            :konsist:test :build-logic:test \
            --continue --parallel --console=plain \
            --init-script .github/ci-expected-failures.init.gradle > "$REPORT_DIR/compatibility.log" 2>&1
          status=$?
          set -e
          printf '{"exitCode":%s}\n' "$status" > "$REPORT_DIR/compatibility-status.json"
          tail -n 200 "$REPORT_DIR/compatibility.log"
          exit "$status"

      - name: Collect Maven metadata and OSV evidence
        run: |
          node .github/scripts/collect-dependency-audit.mjs \
            --root . \
            --build-environment-report "$REPORT_DIR/resolved/root-build-environment.txt" \
            --resolved-report "$REPORT_DIR/resolved/app-debug-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/konsist-test-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/core-model-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/core-domain-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/onboarding-domain-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/feed-domain-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/editor-domain-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/profile-domain-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/foryou-domain-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/notification-domain-runtime.txt" \
            --resolution-status "$REPORT_DIR/resolution-status.txt" \
            --compatibility-status "$REPORT_DIR/compatibility-status.json" \
            --output "$REPORT_DIR/dependency-audit.json" \
            --summary "$REPORT_DIR/dependency-audit.md"

      - name: Add audit to job summary
        run: cat "$REPORT_DIR/dependency-audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update actionable issues
        if: github.event_name == 'schedule' || inputs.publish_issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-dependency-audit-issues.mjs "$REPORT_DIR/dependency-audit.json"

      - name: Upload machine-readable audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-dependency-audit
          path: ${{ env.REPORT_DIR }}
          # 예외: 주간 감사 증거 — 스케줄 주기가 7일이라 표준 7일이면 다음 실행 시점에 직전 회차가
          # 만료돼 회차 간 비교가 끊긴다. 한 회차가 겹치도록 14일로 둔다 (#1400).
          retention-days: 14

      - name: Fail when current compatibility gate failed
        if: steps.compatibility.outcome == 'failure'
        run: exit 1

      - name: Remove release build configuration
        if: always()
        uses: ./.github/actions/cleanup-release-config
