name: Generate PR Dependency Graph

# PR 에서 의존성 입력이 바뀔 때만 write token 없는 snapshot artifact 를 만든다.
# default branch 의 Submit PR Dependency Graph workflow_run 이 검토된 코드로 artifact 를 제출한다.
# 이전 workflow 이름과 분리해 이미 대기 중인 source-only run 이 새 uploader 를 깨우지 않게 한다.
on:
  pull_request:
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.lockfile'
      - '**/build-logic/**'
      - '**/buildSrc/**'
      - '**/gradle.properties'
      - '**/gradlew'
      - '**/gradlew.bat'
      - 'gradle/**'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/dependency-submission.yml'
      - '.github/workflows/dependency-submission-trusted.yml'
      - '.github/workflows/dependency-submission-upload.yml'

concurrency:
  group: generate-pr-dependency-graph-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-pr-snapshot:
    name: Generate PR dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # base(develop)·head(PR) 스냅샷이 같은 correlator 라야 compare API 가 둘을 짝짓는다.
      # job 이름을 따라 갈리면 develop base PR 에서 base 가 0 건으로 보여 그 PR 의 의존성
      # 전량이 «신규 도입» 으로 계산되고, 기존 의존성의 취약점이 그 PR 탓으로 걸린다 (#1009).
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: careercompass-gradle-dependency-graph
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate dependency graph artifact
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          additional-arguments: --no-configuration-cache --stacktrace
          # 예외: job 간 전송용 — 제출 job 이 같은 run 안에서 소비한다 (#1400).
          artifact-retention-days: 1
          cache-provider: basic
          cache-read-only: true
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: false
          validate-wrappers: true
