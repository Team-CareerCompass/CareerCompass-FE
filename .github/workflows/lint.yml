name: Static Analysis

# PR 검증은 pr-validation.yml 이 한 번에 부르고, 이 워크플로의 두 job check 를
# ruleset 에서 required 로 직접 요구한다. concurrency 는 진입점에서 PR 단위로 건다.
#
# 트리거를 workflow_call 하나로 두는 것이 요점이다 — on: pull_request 를 함께 남기면
# 같은 검증과 동일한 이름의 check 가 PR 마다 두 벌씩 돈다.
on:
  workflow_call:
    inputs:
      pull_request_number:
        required: false
        default: 0
        type: number
      run_ktlint:
        description: "영향 범위 Ktlint 실행 여부"
        required: false
        default: true
        type: boolean
      ktlint_tasks:
        description: "신뢰된 영향도 계산기가 만든 Ktlint task 목록"
        required: false
        default: "ktlintCheck :build-logic:ktlintCheck"
        type: string
      run_android_lint:
        description: "영향 범위 Android Lint 실행 여부"
        required: false
        default: true
        type: boolean
      android_lint_tasks:
        description: "신뢰된 영향도 계산기가 만든 Android Lint task 목록"
        required: false
        default: "lintDebug :app:processDebugMainManifest"
        type: string
      verify_manifest:
        description: "app merged manifest 정책 검증 여부"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ktlint:
    name: Check Code Quality (Ktlint)
    if: inputs.run_ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      # 캐싱 소유자는 setup-gradle 하나 — setup-java 의 cache: gradle 은 정책 테스트
      # (supply-chain-policy.test.mjs)가 금지한다. wrapper 검증도 여기서 fail-closed.
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      # ktlint 를 돌리는 자리는 여기 하나다. 예전에는 ScaCap/action-ktlint(reviewdog)가
      # PR diff 의 추가된 줄을, 이 태스크가 저장소 전체를 각각 검사해 같은 규칙을 두 번
      # 돌렸다 — reviewdog 경로만 32초, job 의 30% 였다. 인라인 코멘트의 원래 수요자는
      # 로그를 뒤지기 싫은 사람인데 이 저장소 작업자는 에이전트라 로그를 직접 읽는다.
      # 막는 것(ktlintCheck)만 남기고 알려주는 것은 아래 job summary 로 옮겼다 (#1012).
      #
      # 저장소 전체 검사는 유지한다 — 파일을 지우면서 남은 파일에 새로 발생하는 파일 단위
      # 위반은 diff 필터로 보이지 않는다 (#875).
      # --build-cache 는 CI 한정 — gradle.properties 의 org.gradle.caching=false 로컬 기본값은 그대로다 (#996).
      - name: Run Ktlint
        env:
          GRADLE_TASKS: ${{ inputs.ktlint_tasks }}
        run: |
          read -r -a tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}" --continue --parallel --build-cache

      # 실패한 위치를 Actions 로그 수천 줄이 아니라 job summary 상단에서 바로 보게 한다.
      # ktlint-gradle 이 모듈마다 남긴 checkstyle XML 을 읽으므로 검사가 다시 돌지 않는다.
      - name: Summarize ktlint violations
        if: always()
        run: node .github/scripts/render-ktlint-summary.mjs

  android-lint:
    name: Check Project Issues (Android Lint)
    if: inputs.run_android_lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Run Android Lint and build merged manifest
        env:
          GRADLE_TASKS: ${{ inputs.android_lint_tasks }}
        run: |
          read -r -a tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}" --continue --parallel --build-cache

      - name: Verify merged Android manifest policy
        if: inputs.verify_manifest
        run: >-
          node .github/scripts/verify-android-manifest.mjs
          app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml

      # 모듈별 lint XML 을 job summary 한 곳에 모은다 — :feature/* · :core/* 위반이
      # Actions step 로그(수만 줄)에 묻히던 문제(#279)를 여기서 푼다.
      #
      # 예전엔 이 자리에서 XML 을 합쳐 reviewdog(dvdandroid/action-android-lint)에 넘겼다.
      # 그 도커 액션은 매 run 마다 reviewdog 을 `wget -q … | sh` 로 받는데, 설치가 실패해도
      # 파이프 exit status 는 sh 의 것이라 이미지 빌드는 성공하고 entrypoint 에서
      # `reviewdog: not found` 로 죽었다 — lint 위반이 0건이어도 required check 가 red 가
      # 됐다. 이미지는 job 당 한 번만 빌드되므로 스텝 재시도로는 풀리지 않는다 (#1093).
      # 인라인 코멘트를 job summary 로 대체한 판단은 ktlint 쪽과 같다 (#1012).
      - name: Summarize Android Lint violations
        if: always()
        run: node .github/scripts/render-android-lint-summary.mjs
