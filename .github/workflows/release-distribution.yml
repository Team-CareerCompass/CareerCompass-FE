name: Release Distribution (Firebase App Distribution)

# 배포 경로는 main 릴리스 머지 하나뿐이다. develop 수동 배포(workflow_dispatch)가 있었지만 실행
# 4회가 전부 경로 검증·릴리스 직전 리허설이었고, 그 명분이던 "테스터 배포는 develop 기준 수시로" 로
# 쓰인 적이 없어 제거했다 (#1029). 두 경로는 도착지(Firebase `careercompass` 그룹)도 산출물 버전도 같아
# 실익이 PR 생성 한 단계뿐인 반면, dispatch 는 release keystore 와 service account 를 임의 ref 에
# 노출하는 표면이었다.

on:
  push:
    branches: [main]

# 같은 Firebase App Distribution 앱에 올리는 경로를 전부 이 group 하나로 직렬화한다 — main 릴리스
# push 에 WIF canary(firebase-wif-canary.yml)가 겹치면 러너 둘이 같은 앱에 업로드한다. group 문자열은
# 두 워크플로가 공유하므로 한쪽만 바꾸면 방호가 풀린다 (#995).
# cancel-in-progress 는 기본값(false) 그대로 — 진행 중 업로드가 취소되면 부분 상태가 남는다.
concurrency:
  group: firebase-app-distribution-upload

# 최상단을 비워 두고 권한은 provenance 를 발급하는 job 에서만 연다 (#851). attestations·id-token 은
# 이 저장소 이름으로 Sigstore 서명을 받는 권한이라, 워크플로 기본값으로 두면 나중에 추가되는 job 이
# 조용히 물려받는다.
permissions: {}

jobs:
  distribute:
    name: Build Release and Upload to Firebase App Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 보호 규칙(deployment branch 제한·required reviewer·environment secret)은 워크플로 파일로
    # 지정할 수 없다 — 여긴 연결점만 만들고 실제 설정은 Settings → Environments 에서 한다.
    environment: release-distribution
    # 빌드·attest·업로드가 한 job 에 있는 이유: signed APK 를 job 사이로 넘기려면 Actions artifact
    # 가 필요한데 public 저장소라 그 경로를 쓸 수 없다. 그래서 이 job 이 곧 provenance job 이고,
    # 권한도 여기서만 최소로 연다 — pull-requests: read 는 릴리스 노트를 읽는 아래 step 몫이다.
    permissions:
      attestations: write
      contents: read
      id-token: write
      pull-requests: read
    steps:
      # 이 job 은 release keystore·Firebase service account 를 받는다. 트리거가 push: [main] 하나여서
      # ref 가 main 으로 고정되므로, 예전의 수동 실행용 브랜치 가드는 더 방어할 대상이 없어 제거했다.
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load release metadata from main PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_BODY_FILE: ${{ runner.temp }}/main-release-pr-body.md
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last | .body // empty' \
            > "$RELEASE_PR_BODY_FILE"

      - name: Prepare Firebase release notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PR_BODY_FILE: ${{ runner.temp }}/main-release-pr-body.md
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-app-distribution-release-notes.txt
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/render-distribution-release-notes.sh "$RELEASE_NOTES_FILE"
          cat "$RELEASE_NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: false
          validate-wrappers: true

      - name: Set up release build configuration
        id: release_config
        uses: ./.github/actions/setup-release-config
        with:
          require: >-
            KAKAO_NATIVE_APP_KEY GOOGLE_WEB_CLIENT_ID GOOGLE_SERVICES_JSON_B64
            RELEASE_STORE_FILE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS
            RELEASE_KEY_PASSWORD
          kakao-native-app-key: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          google-web-client-id: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          google-services-json-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          release-store-file-b64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
          release-store-password: ${{ secrets.RELEASE_STORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
          compose-local-properties: 'true'

      # 빌드와 업로드를 갈라 놓은 이유는 그 사이에 attest 할 «파일 하나» 를 확정하기 위해서다.
      # digest 는 signing 이 끝난 바로 그 APK 에서 뜨고, 이후 단계는 전부 이 값을 기준으로 판정한다.
      # 이 step 에는 Google 자격이 없다. WIF 전환(#850) 이후로는 파이프라인 어디에도 장기 키가
      # 없고, 업로드 직전에 발급되는 단기 credential 만 존재한다 (#851 의 «노출을 미룬다» 가
      # «애초에 저장하지 않는다» 로 바뀌었다).
      - name: Build signed release APK
        id: release_apk
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          ./gradlew assembleRelease --no-daemon

          mapfile -t apk_files < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "::error::업로드할 release APK가 정확히 1개여야 합니다."
            exit 1
          fi
          echo "path=${apk_files[0]}" >> "$GITHUB_OUTPUT"
          node .github/scripts/verify-release-attestation.mjs \
            digest "${apk_files[0]}" "$GITHUB_OUTPUT"

      # subject 는 경로 하나다. attestation 에는 source repository·commit·workflow identity 가
      # SLSA provenance 로 들어가고, APK 자체는 여기서도 게시되지 않는다.
      - name: Attest the exact signed APK
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.release_apk.outputs.path }}
          show-summary: false

      # fail-closed 지점. 서명·저장소·signer workflow·source commit/ref·GitHub-hosted 러너를 모두
      # 검증하고, 검증된 attestation 의 subject digest 가 빌드 직후 digest 와 다르면 여기서 멈춘다.
      - name: Verify provenance and attestation subject digest
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          EXPECTED_SHA256: ${{ steps.release_apk.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APK_PATH: ${{ steps.release_apk.outputs.path }}
        run: |
          verification_file="$RUNNER_TEMP/verified-release-attestation.json"
          gh attestation verify "$RELEASE_APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-distribution.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --format json > "$verification_file"

          node .github/scripts/verify-release-attestation.mjs \
            verify "$RELEASE_APK_PATH" "$EXPECTED_SHA256" "$verification_file"

      - name: Verify WIF configuration is set
        env:
          GCP_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.GCP_FIREBASE_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          missing=""
          [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -z "$GCP_FIREBASE_SERVICE_ACCOUNT" ] && missing="$missing GCP_FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::필수 WIF 설정 누락:$missing"
            exit 1
          fi

      # v3 immutable SHA. 이 단계 전에는 Google Cloud WIF credential 이 발급되지 않는다.
      # 토큰 수명이 짧으므로 빌드·attestation 이 끝난 업로드 직전에 발급한다 (#850).
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      # Firebase App Distribution Gradle plugin 이 GOOGLE_APPLICATION_CREDENTIALS 환경변수로
      # credential 파일 경로를 인식한다. 그 값은 위 auth 액션이 export_environment_variables 로
      # 내보내는 단기 credential 이다 — 워크플로가 손으로 지정하지 않는다.
      # 참고: https://firebase.google.com/docs/app-distribution/android/distribute-gradle
      #
      # --artifactPath 로 이미 attest 된 파일만 올린다. 인자를 빼면 plugin 이 assemble 을 다시
      # 엮어 검증 대상과 업로드 대상이 갈라진다. 업로드 직전 digest 재계산이 그 마지막 자물쇠다.
      - name: Upload the attested APK to Firebase App Distribution
        env:
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          EXPECTED_SHA256: ${{ steps.release_apk.outputs.sha256 }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          RELEASE_APK_PATH: ${{ steps.release_apk.outputs.path }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-app-distribution-release-notes.txt
        run: |
          node .github/scripts/verify-release-attestation.mjs \
            assert "$RELEASE_APK_PATH" "$EXPECTED_SHA256"

          ./gradlew appDistributionUploadRelease \
            --artifactPath="$RELEASE_APK_PATH" \
            --releaseNotesFile="$RELEASE_NOTES_FILE" \
            --no-daemon

          {
            echo "### Release distribution provenance"
            echo "- result: PASS"
            echo "- source: \`$GITHUB_SHA\`"
            echo "- artifact digest: \`sha256:$EXPECTED_SHA256\`"
            echo "- attestation: $ATTESTATION_URL"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release build configuration
        if: always()
        uses: ./.github/actions/cleanup-release-config
        with:
          keystore-path: ${{ steps.release_config.outputs.keystore-path }}
