name: Build Cache Warm

# PR 검증 job 4개가 같은 commit 의 같은 debug variant 를 각자 처음부터 컴파일하던 문제(#996)의
# 공급 측이다. lint·unit-test·screenshot 은 --build-cache 로 읽을 준비가 돼 있지만, PR job 은
# cache poisoning 방지를 위해 전부 cache-read-only 라 아무도 캐시를 채우지 않는다.
#
# 이 워크플로가 develop push 에서 유일한 writer 다. CodeQL 이 그 역할을 겸하던 시절에는
# 캐시를 채우려고 --build-cache 를 붙였다가 추출기가 컴파일러 호출을 관찰하지 못하는
# 문제로 되돌려야 했다(#1014). 워밍과 분석을 분리해 둘 다 제 조건에서 돌게 한다.
#
# 트리거를 캐시 키 입력으로 좁힌다. 이 워크플로의 Gradle 캐시를 만드는 것은 setup-gradle 이다
# (setup-java 는 `cache:` 없이 JDK 만 깐다). basic 캐시는 키를 아래 6종의 해시로 만들고,
# restoreKeys 를 두지 않으며(“start with a clear cache after dependency update”), exact match 로
# 복원하면 저장을 건너뛴다. 그래서 키가 그대로인 push 에서 도는 워밍은 «저장이 원천적으로
# 불가능한 run» 이다 — 실측 2건 모두 11분을 쓰고 `Entries: 1 restored, 0 saved` 로 끝났다 (#1047).
#
# 이 목록은 setup-gradle 의 키 입력 정본(GRADLE_BUILD_FILE_PATTERNS)과 같아야 한다. 좁으면 캐시가
# 채워지지 않고, 넓으면 저장 못 하는 run 이 다시 생긴다. build-cache-policy.test.mjs 가 둘의
# 일치를 고정한다.
#
# `gradle.properties` 는 여기 없다 — 키 프리픽스가 `setup-java` 라 그쪽 목록으로 착각하기 쉽지만,
# setup-gradle 의 패턴에는 빠져 있고 `**/*.gradle*` 도 이 이름을 매칭하지 않는다(`.gradle` 이
# 부분 문자열로 없다). 넣으면 이 PR 이 없애려는 무저장 run 을 그 파일 변경마다 재현한다.
on:
  push:
    branches: [develop]
    paths:
      - '**/*.gradle*'
      - '**/gradle-wrapper.properties'
      - 'buildSrc/**/Versions.kt'
      - 'buildSrc/**/Dependencies.kt'
      - 'gradle/*.versions.toml'
      - '**/versions.properties'
  workflow_dispatch:

# 워밍은 취소하지 않는다. develop 은 PR 을 연달아 머지하는 브랜치라 cancel-in-progress 면
# 마지막 push 를 뺀 전부가 중도에 죽고, 캐시를 저장하는 post 스텝까지 못 간다.
concurrency:
  group: build-cache-warm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: Warm Gradle build cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      # 이 저장소에서 cache-read-only: false 를 쓰는 유일한 자리다. setup-gradle 의 기본값은
      # «default branch 에서만 write» 인데 이 저장소의 default branch 는 main 이라, develop 에서
      # 쓰려면 명시해야 한다. 캐시 대상에는 caches/build-cache-1 이 포함된다.
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: false
          validate-wrappers: true

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      # PR 이 실제로 돌리는 태스크와 같은 것을 돌려야 그 산출물이 재사용된다. 목록은
      # lint.yml(ktlintCheck·lintDebug)과 unit-test.yml 의 태스크를 합친 것이다.
      #
      # screenshot 은 넣지 않는다 — docker 컨테이너 안에서 돌아 캐시 키에 들어가는 실행
      # 환경이 러너와 갈릴 수 있고, 그 job 이 실제로 아끼는 컴파일 산출물은 여기서 이미
      # 채워진다.
      #
      # --continue 는 develop 이 깨져 있을 때도 통과한 만큼은 캐시에 남기기 위한 것이다.
      # 워밍은 게이트가 아니므로 실패가 머지를 막지 않는다.
      #
      # init script 는 develop 에 의도적으로 남긴 red 게이트(.github/ci-expected-failures.json)를
      # 제외한다. 없으면 :koverXmlReportCi 가 그 테스트를 그대로 돌려 이 워크플로가 상시 red 가
      # 되고, develop 을 실제로 깨뜨린 회귀가 같은 빨간 X 에 묻힌다. XPASS 감시는 여기 붙이지
      # 않는다 — 게이트 해제를 강제하는 probe 는 unit-test.yml 이 이미 돌리고, 실패가 아무것도
      # 막지 못하는 이 워크플로는 그 신호를 실을 자리가 아니다.
      - name: Populate build cache with the tasks pull requests run
        run: >-
          ./gradlew
          ktlintCheck
          lintDebug
          :koverXmlReportCi
          :konsist:test
          :build-logic:test
          :app:compileDebugAndroidTestKotlin
          --continue
          --parallel
          --build-cache
          --init-script .github/ci-expected-failures.init.gradle
