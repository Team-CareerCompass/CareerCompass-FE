name: Submit Trusted Branch Dependency Graph

# develop·main 의 모든 새 SHA 에 신뢰된 base snapshot 을 직접 제출한다. PR dependency-review 는
# base ref 와 head ref snapshot 을 짝지어 비교하므로 source-only push 도 최신 base SHA 가 필요하다.
# PR artifact uploader 는 이 workflow 이름을 구독하지 않아 artifact 없는 후속 run 을 만들지 않는다.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: trusted-branch-dependency-submission-${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit-trusted-branch:
    if: github.event_name == 'push'
    name: Submit trusted branch dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # PR artifact 와 같은 correlator 를 써야 base·head snapshot 이 같은 비교 축에 들어간다.
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: careercompass-gradle-dependency-graph
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          additional-arguments: --no-configuration-cache --stacktrace
          cache-provider: basic
          # 이 job 은 의존성만 해석하므로 저장할 build cache 산출물이 없다. 생략하면 액션
          # 기본값으로 저장까지 하는데, 그 엔트리는 build-cache-warm.yml 이 채우려는 것과
          # 같은 키를 쓴다. 3분이면 끝나는 이쪽이 13분 걸리는 워밍보다 먼저 키를 차지해
          # 워밍의 저장이 통째로 버려진 실적이 있다 (#1480 — run #137·#138).
          cache-read-only: true
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          validate-wrappers: true

  submit-main-baseline:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    name: Submit main dependency graph baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # 임의 입력을 받지 않고 실제 checkout 한 main HEAD 에만 기준선을 귀속한다.
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: careercompass-gradle-dependency-graph
      GITHUB_DEPENDENCY_GRAPH_REF: refs/heads/main
    steps:
      - name: Clone main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Bind snapshot to checked-out main SHA
        id: main-snapshot
        shell: bash
        run: |
          snapshot_sha="$(git rev-parse HEAD)"
          echo "sha=$snapshot_sha" >> "$GITHUB_OUTPUT"
          echo "GITHUB_DEPENDENCY_GRAPH_SHA=$snapshot_sha" >> "$GITHUB_ENV"
          echo "Submitting refs/heads/main at \`$snapshot_sha\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit main dependency graph baseline
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          additional-arguments: --no-configuration-cache --stacktrace
          cache-provider: basic
          # 이 job 은 의존성만 해석하므로 저장할 build cache 산출물이 없다. 생략하면 액션
          # 기본값으로 저장까지 하는데, 그 엔트리는 build-cache-warm.yml 이 채우려는 것과
          # 같은 키를 쓴다. 3분이면 끝나는 이쪽이 13분 걸리는 워밍보다 먼저 키를 차지해
          # 워밍의 저장이 통째로 버려진 실적이 있다 (#1480 — run #137·#138).
          cache-read-only: true
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          validate-wrappers: true
