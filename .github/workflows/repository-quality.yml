name: Repository Quality

# PR 에서는 pr-validation.yml 이 부른다. develop·main push 는 여기서 직접 돈다 (#848).
on:
  workflow_call:
    inputs:
      pull_request_number:
        required: false
        default: 0
        type: number
    outputs:
      docs_only:
        description: "README.md 와 docs/ 아래 파일만 바뀐 PR인지 여부"
        value: ${{ jobs.repository-quality.outputs.docs_only }}
      ktlint_required:
        description: "변경 파일에 Ktlint 검증이 필요한지 여부"
        value: ${{ jobs.repository-quality.outputs.ktlint_required }}
      ktlint_tasks:
        description: "변경 모듈에 한정한 Ktlint Gradle task 목록"
        value: ${{ jobs.repository-quality.outputs.ktlint_tasks }}
      android_lint_required:
        description: "영향 모듈에 Android Lint가 필요한지 여부"
        value: ${{ jobs.repository-quality.outputs.android_lint_required }}
      android_lint_tasks:
        description: "역방향 의존 영향 범위의 Android Lint task 목록"
        value: ${{ jobs.repository-quality.outputs.android_lint_tasks }}
      verify_manifest:
        description: "app merged manifest 정책 검증이 필요한지 여부"
        value: ${{ jobs.repository-quality.outputs.verify_manifest }}
      unit_test_required:
        description: "영향 범위 단위 테스트 또는 정책 테스트가 필요한지 여부"
        value: ${{ jobs.repository-quality.outputs.unit_test_required }}
      run_node_tests:
        description: "GitHub Actions 정책 Node 테스트가 필요한지 여부"
        value: ${{ jobs.repository-quality.outputs.run_node_tests }}
      unit_test_tasks:
        description: "영향 모듈에 한정한 단위 테스트/Kover Gradle task 목록"
        value: ${{ jobs.repository-quality.outputs.unit_test_tasks }}
      coverage_modules:
        description: "PR Kover 보고서 대상 모듈 목록"
        value: ${{ jobs.repository-quality.outputs.coverage_modules }}
      screenshot_required:
        description: "영향받는 Compose screenshot baseline이 있는지 여부"
        value: ${{ jobs.repository-quality.outputs.screenshot_required }}
      screenshot_modules:
        description: "영향받는 screenshot 모듈 목록"
        value: ${{ jobs.repository-quality.outputs.screenshot_modules }}
      screenshot_tasks:
        description: "영향받는 screenshot 검증 task 목록"
        value: ${{ jobs.repository-quality.outputs.screenshot_tasks }}
      codeql_actions:
        description: "Actions CodeQL 분석이 필요한지 여부"
        value: ${{ jobs.repository-quality.outputs.codeql_actions }}
      codeql_java_kotlin:
        description: "Java/Kotlin CodeQL 분석이 필요한지 여부"
        value: ${{ jobs.repository-quality.outputs.codeql_java_kotlin }}
  push:
    branches: [develop, main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository Quality
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.classify-documentation-changes.outputs.docs_only }}
      ktlint_required: ${{ steps.classify-documentation-changes.outputs.ktlint_required }}
      ktlint_tasks: ${{ steps.classify-documentation-changes.outputs.ktlint_tasks }}
      android_lint_required: ${{ steps.classify-documentation-changes.outputs.android_lint_required }}
      android_lint_tasks: ${{ steps.classify-documentation-changes.outputs.android_lint_tasks }}
      verify_manifest: ${{ steps.classify-documentation-changes.outputs.verify_manifest }}
      unit_test_required: ${{ steps.classify-documentation-changes.outputs.unit_test_required }}
      run_node_tests: ${{ steps.classify-documentation-changes.outputs.run_node_tests }}
      unit_test_tasks: ${{ steps.classify-documentation-changes.outputs.unit_test_tasks }}
      coverage_modules: ${{ steps.classify-documentation-changes.outputs.coverage_modules }}
      screenshot_required: ${{ steps.classify-documentation-changes.outputs.screenshot_required }}
      screenshot_modules: ${{ steps.classify-documentation-changes.outputs.screenshot_modules }}
      screenshot_tasks: ${{ steps.classify-documentation-changes.outputs.screenshot_tasks }}
      codeql_actions: ${{ steps.classify-documentation-changes.outputs.codeql_actions }}
      codeql_java_kotlin: ${{ steps.classify-documentation-changes.outputs.codeql_java_kotlin }}
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 한도가 바닥인 채로 들어가면 이 required check 가 코드와 무관하게 빨개진다. 남은 quota 를
      # 요약에 남기고, 부족하면 리셋까지 기다린다 — 즉시 실패시키면 사람이 재실행을 걸고 그
      # 재실행이 남은 quota 를 더 태운다 (#1465).
      #
      # merge-order-guard 와 달리 PR 사본으로 돌린다. 이 job 은 이미 PR 사본의 분류·검증
      # 스크립트를 실행하므로 새로 열리는 신뢰 경계가 없고, quota 스텝은 게이트가 아니라
      # 관측·대기라 PR 이 그것을 무력화해도 통과시킬 수 있는 판정이 없다.
      - name: Ensure GitHub API quota
        if: inputs.pull_request_number > 0
        env:
          GH_TOKEN: ${{ github.token }}
        # 이 job 의 timeout 이 3분이라 기다릴 수 있는 창이 좁다. 그보다 먼 리셋은 기다리지
        # 않고 «한도 소진» 으로 명시하고 끝낸다.
        run: node .github/scripts/ensure-api-quota.mjs ensure --max-wait 60

      # GitHub 의 server-side paths 평가는 유한한 diff 앞부분만 보므로, 그 경계를 넘는 PR 을
      # 그대로 허용하면 뒤쪽 dependency 파일이 graph/review workflow 를 우회할 수 있다.
      # 공식 문서의 상충하는 300/3,000 한도 중 보수적인 300을 fail-closed 경계로 쓴다.
      - name: Guard server-side path filter boundary
        id: changed-files
        if: inputs.pull_request_number > 0
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
          MAX_PATH_FILTER_FILES: 300
          PR_EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail

          pull_request_file="$RUNNER_TEMP/pull-request.json"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            state=$(jq -r '.state' <<< "$pull_request")
            head_sha=$(jq -r '.head.sha' <<< "$pull_request")
            head_repository=$(jq -r '.head.repo.full_name' <<< "$pull_request")
            if [ "$state" != "open" ] || [ "$head_repository" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::PR #$PR_NUMBER 는 이 저장소의 열린 PR이 아닙니다"
              exit 1
            fi
            if [ "$GITHUB_SHA" != "$head_sha" ]; then
              echo "::error::dispatch ref $GITHUB_SHA 가 PR #$PR_NUMBER head $head_sha 와 다릅니다"
              exit 1
            fi
            CHANGED_FILES=$(jq -r '.changed_files' <<< "$pull_request")
            printf '%s' "$pull_request" > "$pull_request_file"
          elif [ -z "$CHANGED_FILES" ]; then
            pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            CHANGED_FILES=$(jq -r '.changed_files' <<< "$pull_request")
            printf '%s' "$pull_request" > "$pull_request_file"
          else
            jq '.pull_request' "$GITHUB_EVENT_PATH" > "$pull_request_file"
            # 이벤트 페이로드의 라벨은 «트리거 시점» 값이라 그 뒤에 붙인 라벨이 없다. 면제 라벨
            # (test-only-production-exempt · issue-assignee-exempt)은 게이트가 빨개진 **뒤에** 붙이는
            # 것이라 언제나 그 뒤다 — 그대로 두면 라벨을 붙여도 재실행이 같은 페이로드를 다시 읽어
            # 면제가 영영 듣지 않는다. 라벨만 라이브로 덮어쓴다(호출 하나).
            labels_file="$RUNNER_TEMP/pull-request-labels.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" > "$labels_file"
            jq --slurpfile labels "$labels_file" '.labels = $labels[0]' "$pull_request_file" > "$pull_request_file.tmp"
            mv "$pull_request_file.tmp" "$pull_request_file"
          fi

          if ! [[ "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error::PR changed_files 값이 유효하지 않습니다: $CHANGED_FILES"
            exit 1
          fi

          if (( CHANGED_FILES > MAX_PATH_FILTER_FILES )); then
            # 릴리스 PR(develop → main)만 면제한다. 이 가드가 막으려는 것은 «paths 필터를
            # 우회한 의존성 변경이 검토 없이 들어오는 것» 인데, 릴리스 PR 의 모든 변경은
            # 이미 develop base PR 로 한 번씩 들어오면서 300 이하에서 필터와
            # dependency-review 를 통과했다. 릴리스는 새 코드를 만들지 않고 검증된 develop
            # 을 main 으로 옮기는 머지다. 그리고 「PR 을 분리하세요」 가 유일하게 성립하지
            # 않는 PR 이기도 하다 — 쪼개면 그건 릴리스가 아니다 (#1559).
            #
            # 크기가 아니라 «릴리스 PR 인가» 로 가른다. 크기를 기준으로 열면 가드가
            # 무의미해진다.
            base_ref="$(jq -r '.base.ref' "$pull_request_file")"
            head_ref="$(jq -r '.head.ref' "$pull_request_file")"
            if [ "$base_ref" = "main" ] && [ "$head_ref" = "develop" ]; then
              echo "::notice::릴리스 PR(develop → main)이라 paths 경계 ${MAX_PATH_FILTER_FILES}개 검사를 건너뜁니다 (변경 ${CHANGED_FILES}개). 구성 변경은 각 develop base PR 에서 이미 필터를 거쳤습니다."
            else
              echo "::error::PR 변경 파일 ${CHANGED_FILES}개가 paths 안전 경계 ${MAX_PATH_FILTER_FILES}개를 초과했습니다. PR을 분리하세요."
              exit 1
            fi
          fi

          policy_payload_file="$RUNNER_TEMP/pull-request-policy-input.json"
          jq -n --slurpfile pullRequest "$pull_request_file" \
            '{pull_request: $pullRequest[0]}' > "$policy_payload_file"

          head_repository="$(jq -r '.head.repo.full_name // ""' "$pull_request_file")"
          if [ "$PR_EVENT_ACTION" = "edited" ] && [ "$head_repository" = "$GITHUB_REPOSITORY" ]; then
            head_sha="$(jq -r '.head.sha // ""' "$pull_request_file")"
            if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::edited PR head SHA가 유효하지 않습니다: $head_sha"
              exit 1
            fi
            head_commit_file="$RUNNER_TEMP/pull-request-head-commit.json"
            gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha" > "$head_commit_file"
            jq -n \
              --slurpfile pullRequest "$pull_request_file" \
              --slurpfile headCommit "$head_commit_file" \
              '{pull_request: $pullRequest[0], trusted_head_commit: $headCommit[0]}' \
              > "$policy_payload_file"
          fi

          printf 'count=%s\n' "$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          printf 'pull_request_json=%s\n' "$policy_payload_file" >> "$GITHUB_OUTPUT"

      # 최상위 paths 필터는 required check 자체를 만들지 않아 영구 pending 이 될 수 있다.
      # 모든 파일 페이지와 GitHub 의 changed_files 총수를 대조한 뒤 direct module과 역방향
      # 의존 모듈을 계산한다. API 응답 누락·형식 오류·rename 경계는 모두 실패로 닫히며,
      # 호출자는 이 step이 실패하면 기존 전체 task로 되돌아간다.
      - name: Classify pull request impact
        id: classify-documentation-changes
        if: inputs.pull_request_number > 0
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.count }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail

          files_json="$RUNNER_TEMP/pull-request-files.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$files_json"
          printf 'files_json=%s\n' "$files_json" >> "$GITHUB_OUTPUT"

          docs_only=$(env -u GH_TOKEN -u GITHUB_TOKEN \
            node .github/scripts/classify-documentation-changes.mjs \
            "$CHANGED_FILES" < "$files_json")
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            node .github/scripts/resolve-pr-impact.mjs "$files_json" \
            >> "$GITHUB_OUTPUT"

      - name: Require linked Issue
        if: inputs.pull_request_number > 0
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_PR_ACTOR_ID: ${{ github.event.sender.id }}
          TRUSTED_PR_ACTOR_LOGIN: ${{ github.event.sender.login }}
          TRUSTED_PR_ACTOR_TYPE: ${{ github.event.sender.type }}
          TRUSTED_PR_EVENT_ACTION: ${{ github.event.action }}
        run: node .github/scripts/validate-pr-issue-link.mjs "${{ steps.changed-files.outputs.pull_request_json }}"

      - name: Validate CI Test Plan
        if: inputs.pull_request_number > 0
        env:
          TRUSTED_PR_ACTOR_ID: ${{ github.event.sender.id }}
          TRUSTED_PR_ACTOR_LOGIN: ${{ github.event.sender.login }}
          TRUSTED_PR_ACTOR_TYPE: ${{ github.event.sender.type }}
          TRUSTED_PR_EVENT_ACTION: ${{ github.event.action }}
        run: >-
          node .github/scripts/validate-pr-ci-test-plan.mjs
          "${{ steps.changed-files.outputs.pull_request_json }}"
          "$GITHUB_WORKSPACE"
          "${{ steps.classify-documentation-changes.outputs.files_json }}"

      # PR 이 src/main 에 새로 넣은 함수가 main 어디서도 참조되지 않으면 — 테스트만 부르거나 아무도
      # 안 부르면 — 실패시킨다 (#1895). ProductionVisibilityKonsistTest 는 최상위 선언만 보므로
      # 멤버 함수가 샜다(#1583 의 onReceiverRegisterStart). 면제는 PR 라벨
      # test-only-production-exempt — issue-assignee-exempt 와 같은 자리다.
      - name: Reject test-only production declarations
        if: inputs.pull_request_number > 0
        run: >-
          node .github/scripts/validate-test-only-production-declarations.mjs
          "${{ steps.changed-files.outputs.pull_request_json }}"
          "${{ steps.classify-documentation-changes.outputs.files_json }}"

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail

          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          tool_directory="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          mkdir -p "$tool_directory"

          curl --fail --location --silent --show-error \
            --output "$archive_path" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive_path" \
            | sha256sum --check --strict
          tar -xzf "$archive_path" -C "$tool_directory"
          printf '%s\n' "$tool_directory" >> "$GITHUB_PATH"

      - name: Run repository quality checks
        env:
          FILES_JSON: ${{ steps.classify-documentation-changes.outputs.files_json }}
          FULL_REPOSITORY: ${{ steps.classify-documentation-changes.outputs.repository_quality_full }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          if [[ "$PR_NUMBER" != "0" && "$FULL_REPOSITORY" == "false" ]]; then
            scripts/repository-quality.sh . "$FILES_JSON"
          else
            scripts/repository-quality.sh
          fi

      - name: Verify failing fixtures
        if: inputs.pull_request_number == 0 || steps.classify-documentation-changes.outputs.repository_quality_fixtures == 'true'
        run: scripts/test-repository-quality.sh

      # 실패가 «검사가 사실을 확인하고 거절함» 인지 «한도 소진» 인지 가른다. 구분이 없으면
      # 빨간 required check 를 보고도 원인을 로그까지 들어가야 안다 (#1465).
      - name: Classify a failed gate as rate limit exhaustion
        if: failure() && inputs.pull_request_number > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ensure-api-quota.mjs classify
