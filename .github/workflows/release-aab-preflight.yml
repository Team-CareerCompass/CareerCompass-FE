name: Release AAB Preflight

# develop -> main release PRs, explicit dry runs, and twice-weekly develop checks only. This job
# has no deployment credentials, environment, Firebase distribution, or store publishing path.
on:
  pull_request:
    branches: [main]
  schedule:
    # Detect R8/resource shrinking regressions before the next release PR (Tue/Fri 03:37 KST).
    - cron: '37 18 * * 1,4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-aab-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Build and verify release AAB
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUNDLETOOL_VERSION: "1.18.3"
      BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Set up one-run release signing
        uses: ./.github/actions/setup-ci-release-signing

      - name: Download pinned bundletool
        run: |
          bundletool_jar="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --silent --show-error \
            --output "$bundletool_jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$bundletool_jar" | sha256sum --check --strict
          echo "BUNDLETOOL_JAR=$bundletool_jar" >> "$GITHUB_ENV"
          echo "RELEASE_AAB_REPORT_DIR=$RUNNER_TEMP/release-aab-report" >> "$GITHUB_ENV"

      - name: Restore the previous public size report
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/release-aab-baseline"
          mkdir -p "$baseline_dir"

          previous_run_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=success&per_page=100" \
              --jq ".workflow_runs[] | select(.name == \"Release AAB Preflight\" and .id != ${CURRENT_RUN_ID}) | .id" \
              | sed -n '1p'
          )"
          if [ -z "$previous_run_id" ]; then
            echo "No previous successful release preflight report is available."
            exit 0
          fi

          artifact_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run_id/artifacts" \
              --jq '.artifacts[] | select(.name == "release-aab-preflight-report") | .id' \
              | sed -n '1p'
          )"
          if [ -z "$artifact_id" ]; then
            echo "The previous successful run has no public report artifact."
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$baseline_dir/report.zip"
          unzip -q "$baseline_dir/report.zip" -d "$baseline_dir"
          baseline_path="$baseline_dir/release-aab-preflight.json"
          test -s "$baseline_path"
          echo "RELEASE_AAB_BASELINE_PATH=$baseline_path" >> "$GITHUB_ENV"

      - name: Build, verify, and report release AAB
        env:
          RELEASE_SMOKE_APK_PATH: ${{ runner.temp }}/release-startup-smoke/universal.apk
          SOURCE_SHA: ${{ github.sha }}
        run: bash .github/scripts/run-release-aab-preflight.sh

      # R8 이 만든 런타임 결함은 빌드·서명·크기 검증을 전부 통과한다 — 이름을 문자열로 찾는 코드는
      # 컴파일도 패키징도 되지만 기동에서 죽는다(#1753 의 nav enum keep 누락이 그랬다). 여기가
      # minify 된 산출물을 실제로 켜 보는 유일한 지점이다. 대상은 위에서 이미 만든 universal APK 라
      # 재빌드가 없고, 검증 대상과 배포 대상이 갈라지지 않는다.
      - name: Enable and verify KVM access
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          echo "KERNEL==\"kvm\", OWNER=\"${runner_user}\", GROUP=\"kvm\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Verify the release artifact starts on a device
        env:
          RELEASE_SMOKE_APK_PATH: ${{ runner.temp }}/release-startup-smoke/universal.apk
        run: bash .github/scripts/run-release-startup-smoke.sh

      - name: Prove negative fixtures fail closed
        run: bash .github/scripts/test-release-aab-negative-fixtures.sh

      - name: Remove private release outputs
        if: always()
        run: |
          rm -f \
            "${{ runner.temp }}/release-startup-smoke/universal.apk" \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/mapping/release/mapping.txt \
            app/google-services.json \
            local.properties \
            "$CAREERCOMPASS_CI_RELEASE_KEYSTORE" \
            "$CAREERCOMPASS_CI_RELEASE_STORE_PASSWORD_FILE" \
            "$CAREERCOMPASS_CI_RELEASE_KEY_PASSWORD_FILE"

      - name: Upload digest and size reports only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-aab-preflight-report
          if-no-files-found: error
          # 예외: 릴리스 산출물 — 배포 후 추적 근거로 90일 보관한다 (#1400).
          retention-days: 90
          path: |
            ${{ runner.temp }}/release-aab-report/release-aab-preflight.json
            ${{ runner.temp }}/release-aab-report/release-aab-preflight.md
